<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Login - The Bee Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Background set to the sophisticated deep charcoal -->
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

    <!-- Login Card: White background, Amber accent border, and shadow -->
    <div class="max-w-md w-full mx-auto bg-white p-10 shadow-3xl rounded-xl border-t-8 border-amber-500 transform transition-all duration-500 hover:shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Guest Access Portal</h1>
            <p class="text-sm text-gray-500">Log in to manage your reservation at <span class="text-amber-600 font-semibold">The Bee Hotel</span>.</p>
        </div>
        
        <form id="client-login-form" class="space-y-6">
            <div>
                <label for="client-username" class="block text-sm font-semibold text-gray-700 mb-1">Username / Booking Ref</label>
                <input type="text" id="client-username" name="client-username" required
                       placeholder="Your account username or booking ID"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label for="client-password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="client-password" name="client-password" required
                       placeholder="••••••••"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            
            <!-- Amber login button -->
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-bold text-gray-900 bg-amber-500 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition duration-150">
                Access My Account
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Need an account? <a href="#" class="text-amber-600 hover:text-amber-800 font-medium">Register Here</a>
        </p>
        <!-- Message box for login status -->
        <div id="message-box" class="mt-4 p-3 hidden rounded-lg text-center font-medium"></div>
    </div>

    <script>
        // Utility function to display messages
        function showMessageBox(text, isError = false) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            box.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
            // Hide after a delay
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        }
        
        document.getElementById('client-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // MODIFICATION: Login always succeeds for testing/demo purposes
            const username = document.getElementById('client-username').value;
            
            showMessageBox(`Login successful! Redirecting...`, false);
            this.reset(); // Clear form

            // Redirect to the new client dashboard after a short delay
            setTimeout(() => {
                window.location.href = 'clientdashboard.html';
            }, 500);
        });
    </script>
</body>
</html>
