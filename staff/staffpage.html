<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - The Bee Hotel Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Background remains deep charcoal for sophistication -->
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

    <!-- Gold accent border -->
    <div class="max-w-md w-full mx-auto bg-white p-10 shadow-3xl rounded-xl border-t-8 border-amber-500 transform transition-all duration-500 hover:shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Staff Access Portal</h1>
            <!-- Description updated to include hotel name -->
            <p class="text-sm text-gray-500">Secure Login for The Bee Hotel Employees</p>
        </div>
        
        <form id="staff-login-form" class="space-y-6">
            <div>
                <label for="employee-id" class="block text-sm font-semibold text-gray-700 mb-1">Employee ID / Username</label>
                <input type="text" id="employee-id" name="employee-id" required
                       placeholder="Enter your staff username"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label for="staff-password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="staff-password" name="staff-password" required
                       placeholder="••••••••"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            
            <!-- Gold button -->
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-bold text-gray-900 bg-amber-500 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition duration-150">
                Proceed to Dashboard
            </button>
        </form>
        <!-- Message box for login status -->
        <div id="message-box" class="mt-4 p-3 hidden rounded-lg text-center font-medium"></div>
    </div>

    <script>
        // Utility function to display messages
        function showMessageBox(text, isError = false) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            box.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
            // Hide after a delay
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        }
        
        document.getElementById('staff-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // MODIFICATION: Login always succeeds for testing/demo purposes
            const employeeId = document.getElementById('employee-id').value;
            
            showMessageBox(`Staff Login successful! Welcome, ${employeeId || 'Employee'}!`, false);
            this.reset(); // Clear form
            // In a real application, this would redirect to the staff dashboard
        });
    </script>
</body>
</html>
